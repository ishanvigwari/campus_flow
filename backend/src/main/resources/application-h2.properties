# H2 File-Based Database Configuration (persists data between restarts)
spring.datasource.url=jdbc:h2:file:./data/eduplacement_pro;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (accessible at http://localhost:8080/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# JWT Configuration
jwt.secret=your_jwt_secret_key_change_this_in_production_make_it_at_least_256_bits_long
jwt.expiration=604800000

# Google OAuth Configuration
# Get your Client ID from: https://console.cloud.google.com/apis/credentials
# IMPORTANT: Use the SAME Client ID as in frontend/.env
# This must match VITE_GOOGLE_CLIENT_ID in the frontend
# See GOOGLE_OAUTH_QUICKSTART.md or GOOGLE_OAUTH_SETUP.md for setup instructions
google.client.id=759138252953-36i35og3gqjf4isn7u4ad82o1ldg3uvm.apps.googleusercontent.com

# Logging
logging.level.com.eduplacement=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
cors.allowed-origins=http://localhost:5173
