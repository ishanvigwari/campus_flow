# ==========================================
# Server Configuration
# ==========================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# ==========================================
# Database Configuration
# ==========================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/eduplacement_pro}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

# ==========================================
# JPA/Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==========================================
# JWT Configuration
# ==========================================
jwt.secret=${JWT_SECRET:your_jwt_secret_key_change_this_in_production_make_it_at_least_256_bits_long}
jwt.expiration=${JWT_EXPIRATION:604800000}

# ==========================================
# Google OAuth Configuration
# ==========================================
google.client.id=${GOOGLE_CLIENT_ID:your_google_client_id_here.apps.googleusercontent.com}

# ==========================================
# Logging Configuration
# ==========================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.eduplacement=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==========================================
# File Upload Configuration
# ==========================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# ==========================================
# CORS Configuration
# ==========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==========================================
# Demo Data Configuration
# ==========================================
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}
